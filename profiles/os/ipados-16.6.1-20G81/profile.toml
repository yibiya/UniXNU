# The K60 __DATA is 0x150000 against the 20G81 0xb0000, so the components do not fit at slide 0.
# The device preflight installs scripts/emit_prelink_autoslide.py over the kit entry point, which
# derives the slide from the native segment table (-0xb9c000 for the 20G81 components).
"slide" = "0"
"roots" = ["com.apple.AppleFSCompression.AppleFSCompressionTypeZlib", "com.apple.kec.Compression", "com.apple.driver.AppleARMPlatform", "com.apple.driver.AppleARMWatchdogTimer", "com.apple.driver.AppleAudioClockLibs", "com.apple.driver.AppleEffaceableStorage", "com.apple.driver.AppleIISController", "com.apple.driver.AppleM2ScalerCSCDriver", "com.apple.driver.AppleMobileFileIntegrity", "com.apple.driver.ApplePMGR", "com.apple.driver.IODARTFamily", "com.apple.filesystems.apfs", "com.apple.iokit.CoreAnalyticsFamily", "com.apple.iokit.IOAVFamily", "com.apple.iokit.IOAudio2Family", "com.apple.iokit.IOCECFamily", "com.apple.iokit.IOCryptoAcceleratorFamily", "com.apple.iokit.IOGPUFamily", "com.apple.iokit.IOHDCPFamily", "com.apple.iokit.IOMobileGraphicsFamily", "com.apple.iokit.IOReportFamily", "com.apple.iokit.IOSlowAdaptiveClockingFamily", "com.apple.iokit.IOStorageFamily", "com.apple.iokit.IOSurface", "com.apple.kec.pthread", "com.apple.kec.Libm", "com.apple.kec.corecrypto", "com.apple.kext.AppleMatch", "com.apple.kext.CoreTrust", "com.apple.security.AppleImage4", "com.apple.iokit.IOHIDFamily", "com.apple.iokit.IOHIDEventDriver"]
# v5 step 1 (2026-11-03): demote AppleMobileFileIntegrity to a library-only
# component (pong build-pong-prelinked-boot.py:78-86 policy). The executable and
# its pointer dependencies stay linked for IOGPU/IOHID/IOMobileGraphics'
# OSBundleLibraries, but the emitter strips IOKitPersonalities and
# AppleSecurityExtension from its __PRELINK_INFO entry, so the real AMFI never
# auto-registers a second security policy; miniamfi stays the only interface.
# com.apple.security.sandbox needs no demotion: it is not in roots at all and
# never enters the image.
# XnuPrelink has no --library-only switch: emit_prelink.py at the pinned
# f876e3ee and at current main both take --root/--slide/--output/
# --early-security-init only. AMFI therefore enters as the full kext and
# publishes its IOKit service, which is what the userland libamfi lookups need.
"extra_args" = ["--library-only", "com.apple.driver.AppleMobileFileIntegrity"]  # 0316 known-good: AMFI demoted, everything else full


["payload"]
# No text fixups and no trust cache yet: the K60 payload is still at the kernel-only stage.


