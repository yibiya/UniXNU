# MGGetProductType() looks this 20-byte id up in libMobileGestalt's product table (J120: 0x80ac7ae0); without it every client that
# switches on the product type (the audio server's routing database, among others) sees an unknown device.
["adt"."product"."bytes"]
"product-id" = "e9fefef6e6f9d12a5ba1a2551866cbbd749f0ec3"


# The audio server reads IODeviceTree:/product/audio. The original node also sets supports-always-listening, left out here.
