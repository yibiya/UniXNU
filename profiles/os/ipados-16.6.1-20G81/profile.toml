["adt"."root"]

["adt"."root"."string"]
"model" = "iPad7,1"
"target-type" = "J120"
# The board name first: the audio server keys its routing database and MediaExperience its per-board tables on it.
"compatible" = "J120AP"


["adt"."chosen"]

["adt"."chosen"."string"]
"osenvironment" = "main"
"crypto-hash-method" = "sha2-384"


# Launchd's early /sbin/mount task calls IOGetBootManifestHash(), which only
# copies /chosen/boot-manifest-hash (48 bytes, matching crypto-hash-method
# sha2-384); it does not verify the value. The restore image ships no manifest
# for this board, so publish a fixed owner digest instead of leaving the task to
# exit 66 (EX_NOINPUT) and take the critical-exit panic.
["adt"."chosen"."bytes"]
"boot-manifest-hash" = "6b36302d6f776e65722d626f6f742d6d616e69666573742d763100000000000000000000000000000000000000000000"


["adt"."chosen"."u32"]
"certificate-production-status" = 0
"effective-production-status-ap" = 0
"certificate-security-mode" = 1
"effective-security-mode-sep" = 1
"amfi-only-platform-code" = 1
"security-mode-change-enable" = 1
"debug-enabled" = 1
# MobileGestalt/FrontBoard read this as the FBSDisplayMode preferredScale.
# Missing it means scale 0: infinite logical dimensions, and SpringBoard
# traps in the mode validity check before creating its main display.
# The panel is 1440x3200, so 3 gives 480x1066.67 points.
"display-scale" = 3


